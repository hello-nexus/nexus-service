name: ci

# Pull request gate: the build and suite the release pipeline runs.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - run: dotnet restore Nexus.slnx

      - name: build (non-Windows TFM)
        run: dotnet build Nexus.slnx --no-restore -c Release -p:BuildWeb=false -p:BuildApps=false -p:TreatWarningsAsErrors=true

      # The full parallel suite intermittently deadlocks on the runner and
      # passes on a re-run; the hang timeout bounds a wedged attempt. The
      # runner is single-tenant, so sweeping every testhost is safe here.
      - name: tests
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::test attempt $attempt"
            dotnet test Nexus.slnx --no-build -c Release -p:BuildWeb=false -p:BuildApps=false \
              --logger "console;verbosity=normal" \
              --blame-hang-timeout 6m --blame-hang-dump-type none
            code=$?
            echo "::endgroup::"
            if [ $code -eq 0 ]; then exit 0; fi
            echo "::warning::test attempt $attempt exited $code; sweeping testhosts and retrying"
            pkill -9 -f testhost 2>/dev/null || true
            pkill -9 -f "dotnet test" 2>/dev/null || true
            sleep 5
          done
          echo "::error::tests failed after 3 attempts"
          exit 1
